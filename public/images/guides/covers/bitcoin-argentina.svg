<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08080a"/>
      <stop offset="0.6" stop-color="#1a1209"/>
      <stop offset="1" stop-color="#3a2108"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="0.6" stop-color="#F7931A"/>
      <stop offset="1" stop-color="#F7931A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="obelisco" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a2f"/>
      <stop offset="0.5" stop-color="#3b3b42"/>
      <stop offset="1" stop-color="#1c1c20"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- celeste bands (flag nod) -->
  <rect y="210" width="1200" height="34" fill="#74ACDF" opacity="0.10"/>
  <rect y="290" width="1200" height="34" fill="#74ACDF" opacity="0.10"/>

  <!-- Sol de Mayo as a bitcoin sun -->
  <g transform="translate(860 250)">
    <circle r="200" fill="url(#sun)" opacity="0.35"/>
    <g stroke="#F7931A" stroke-width="5" stroke-linecap="round" opacity="0.9">
      <path d="M0 -150 L0 -115"/><path d="M0 150 L0 115"/><path d="M-150 0 L-115 0"/><path d="M150 0 L115 0"/>
      <path d="M-106 -106 L-81 -81"/><path d="M106 106 L81 81"/><path d="M-106 106 L-81 81"/><path d="M106 -106 L81 -81"/>
      <path d="M-58 -139 L-44 -106"/><path d="M58 139 L44 106"/><path d="M-139 58 L-106 44"/><path d="M139 -58 L106 -44"/>
      <path d="M58 -139 L44 -106"/><path d="M-58 139 L-44 106"/><path d="M139 58 L106 44"/><path d="M-139 -58 L-106 -44"/>
    </g>
    <circle r="92" fill="#F7931A"/>
    <!-- ₿ glyph -->
    <g fill="#ffffff" transform="rotate(14)">
      <path d="M-28 -58 h46 c24 0 38 12 38 30 c0 13 -7 22 -19 26 c15 4 24 15 24 30 c0 21 -16 34 -42 34 h-47 z M-8 -40 v30 h22 c11 0 18 -6 18 -15 c0 -9 -7 -15 -18 -15 z M-8 7 v33 h26 c12 0 20 -6 20 -16 c0 -11 -8 -17 -20 -17 z"/>
      <rect x="-10" y="-74" width="9" height="20"/><rect x="8" y="-74" width="9" height="20"/>
      <rect x="-10" y="58" width="9" height="20"/><rect x="8" y="58" width="9" height="20"/>
    </g>
  </g>

  <!-- skyline -->
  <g fill="#0d0d10">
    <path d="M0 630 V470 h60 v-40 h50 v60 h40 v-90 h70 v120 h30 v-70 h60 v100 h50 v-140 h40 v30 h70 v110 h50 v-60 h60 v80 h40 v-120 h80 v90 h50 v-50 h60 v70 h70 v-100 h50 v130 h60 v-60 h60 v90 V630 Z"/>
  </g>
  <!-- lit windows -->
  <g fill="#F7931A" opacity="0.7">
    <rect x="160" y="420" width="8" height="8"/><rect x="180" y="440" width="8" height="8"/><rect x="200" y="420" width="8" height="8"/>
    <rect x="470" y="380" width="8" height="8"/><rect x="490" y="400" width="8" height="8"/><rect x="470" y="440" width="8" height="8"/>
    <rect x="830" y="410" width="8" height="8"/><rect x="850" y="430" width="8" height="8"/><rect x="1010" y="440" width="8" height="8"/>
    <rect x="1030" y="470" width="8" height="8"/><rect x="700" y="470" width="8" height="8"/>
  </g>

  <!-- Obelisco -->
  <path d="M352 630 L372 210 L386 180 L400 210 L420 630 Z" fill="url(#obelisco)"/>
  <path d="M386 180 L392 193 L386 200 L380 193 Z" fill="#F7931A"/>
  <rect x="384" y="250" width="4" height="10" fill="#FFD27A" opacity="0.8"/>

  <!-- meetup crowd as glowing nodes along the street -->
  <g stroke="#F7931A" stroke-width="2" opacity="0.6" fill="none">
    <path d="M120 590 Q 300 540 480 585 T 840 580 T 1100 590"/>
  </g>
  <g fill="#FFD27A">
    <circle cx="120" cy="590" r="7"/><circle cx="300" cy="560" r="6"/><circle cx="480" cy="585" r="8"/>
    <circle cx="660" cy="600" r="6"/><circle cx="840" cy="580" r="8"/><circle cx="1100" cy="590" r="7"/>
  </g>
</svg>
