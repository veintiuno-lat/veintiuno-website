<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="62%" cy="55%" r="70%">
      <stop offset="0" stop-color="#2a1806"/>
      <stop offset="0.55" stop-color="#110c08"/>
      <stop offset="1" stop-color="#08080a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7931A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F7931A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="1" stop-color="#141417"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#F7931A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- network links from the hub -->
  <g stroke="#F7931A" stroke-width="2" fill="none" opacity="0.55">
    <path d="M740 300 C 640 220, 560 170, 470 150"/>
    <path d="M740 300 C 700 180, 720 120, 760 90"/>
    <path d="M740 300 C 820 200, 930 150, 1030 140"/>
    <path d="M740 300 C 880 290, 980 300, 1090 330"/>
    <path d="M740 300 C 640 330, 560 360, 460 400"/>
    <path d="M740 300 C 860 380, 950 450, 1040 500"/>
  </g>
  <g fill="#F7931A">
    <circle cx="470" cy="150" r="9"/><circle cx="760" cy="90" r="7"/>
    <circle cx="1030" cy="140" r="10"/><circle cx="1090" cy="330" r="8"/>
    <circle cx="460" cy="400" r="7"/><circle cx="1040" cy="500" r="9"/>
  </g>
  <g fill="none" stroke="#F7931A" opacity="0.35">
    <circle cx="470" cy="150" r="20"/><circle cx="1030" cy="140" r="22"/><circle cx="1040" cy="500" r="20"/>
  </g>

  <!-- glow behind the node -->
  <ellipse cx="740" cy="330" rx="300" ry="220" fill="url(#glow)"/>

  <!-- mini PC (isometric-ish box) -->
  <g>
    <path d="M590 430 L740 370 L890 430 L740 490 Z" fill="#3a3a40"/>
    <path d="M590 430 L740 490 L740 560 L590 500 Z" fill="url(#box)"/>
    <path d="M890 430 L740 490 L740 560 L890 500 Z" fill="#1b1b1f"/>
    <path d="M610 470 L700 506" stroke="#F7931A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="715" cy="514" r="4" fill="#7CFFB2"/>
    <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="2">
      <path d="M770 500 L860 464"/><path d="M770 515 L860 479"/><path d="M770 530 L860 494"/>
    </g>
  </g>

  <!-- lightning bolt rising from the node -->
  <path d="M760 160 L690 310 L740 310 L705 420 L815 255 L760 255 L800 160 Z" fill="url(#bolt)" stroke="#FFE2A8" stroke-width="3" stroke-linejoin="round"/>

  <!-- sparkles -->
  <g fill="#FFD27A">
    <circle cx="560" cy="250" r="3"/><circle cx="930" cy="230" r="3"/><circle cx="880" cy="110" r="2.5"/>
    <circle cx="620" cy="110" r="2.5"/><circle cx="990" cy="410" r="3"/>
  </g>
</svg>
